<section class="inspector"><h2>{{title()}}</h2>@for(property of metadata();track property.key){<label class="property"><span class="label">{{property.label}}</span><div class="control">@switch(property.type){@case('number'){<j-input-number [value]="$any(read(property.key))" [min]="property.min??null" [max]="property.max??null" [step]="property.step??1" [disabled]="property.readonly??false" (valueChange)="updateNumber(property,$event)"/>}@case('text'){<j-input-text [value]="$any(read(property.key))" [disabled]="property.readonly??false" (valueChange)="updateText(property,$event)"/>}@case('select'){<j-search-combobox [options]="property.options??[]" [value]="$any(read(property.key))" [disabled]="property.readonly??false" (valueChange)="updateSelect(property,$event)"/>}@if(property.unit){<span class="unit">{{property.unit}}</span>}</div></label>}</section>
