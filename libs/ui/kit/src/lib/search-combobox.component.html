<div class="combobox" (focusout)="onFocusOut($event)"><button class="trigger" type="button" [disabled]="disabled()" [attr.aria-expanded]="open()" aria-haspopup="listbox" (click)="toggle()"><span>{{selected()?.label||placeholder()}}</span><span aria-hidden="true">⌄</span></button>@if(open()&&!disabled()){<div class="popup"><input class="search" type="search" autocomplete="off" [placeholder]="searchPlaceholder()" [value]="query()" (input)="onSearch($event)" (keydown.escape)="close()"/><div class="options" role="listbox">@if(filtered().length===0){<div class="empty">{{emptyText()}}</div>}@for(option of filtered();track option.value){<button class="option" type="button" role="option" [disabled]="option.disabled" [attr.aria-selected]="value()===option.value" (click)="select(option)"><span>{{option.label}}</span>@if(value()===option.value){<span aria-hidden="true">✓</span>}</button>}</div></div>}</div>
